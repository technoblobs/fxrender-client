[package]
name = "fxr"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Command-line client for FXRender — upload, render, and monitor Blender jobs from the terminal"

[[bin]]
name = "fxr"
path = "src/main.rs"

[dependencies]
fxrender-core = { path = "../core" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
futures-util.workspace = true
clap.workspace = true
anyhow.workspace = true
rmcp = { version = "3", features = ["server", "macros", "transport-io", "schemars"] }
