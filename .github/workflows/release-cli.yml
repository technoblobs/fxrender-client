name: Release CLI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            name: macos-aarch64
          - os: macos-14
            target: x86_64-apple-darwin
            name: macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build fxr
        run: cargo build -p fxr --release --target ${{ matrix.target }}
      - name: Pack
        shell: bash
        run: |
          set -euo pipefail
          ext=""
          if [ "${{ runner.os }}" = "Windows" ]; then ext=".exe"; fi
          src="target/${{ matrix.target }}/release/fxr${ext}"
          stage="fxr-${{ matrix.name }}"
          mkdir -p "$stage"
          cp "$src" "$stage/"
          cp LICENSE README.md "$stage/"
          cp cli/README.md "$stage/CLI.md"
          tar -czf "fxr-${{ matrix.name }}.tar.gz" "$stage"
          if command -v sha256sum >/dev/null; then
            sha256sum "fxr-${{ matrix.name }}.tar.gz" > "fxr-${{ matrix.name }}.tar.gz.sha256"
          else
            shasum -a 256 "fxr-${{ matrix.name }}.tar.gz" > "fxr-${{ matrix.name }}.tar.gz.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: fxr-${{ matrix.name }}
          path: |
            fxr-${{ matrix.name }}.tar.gz
            fxr-${{ matrix.name }}.tar.gz.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
